name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash -el {0}

jobs:
  v2-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          environment-file: v2/environment.yml
          activate-environment: ai-briefing-v2
          auto-activate-base: false
      - name: Gate (source rules, lint, format, strict types, tests)
        run: v2/tools/gate.sh

  harvest-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          environment-file: tools/harvest/environment.yml
          activate-environment: ai-briefing-harvest
          auto-activate-base: false
      - name: Offline tests
        run: pytest tools/harvest -q
